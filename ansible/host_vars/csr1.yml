# uplinks[site][link]: link a = odd VLAN (to agg-01), b = even VLAN (to agg-02). Both ride ONE fiber.
# home_port = the original port, where the new circuit ends up after the re-home.
uplinks:
  csr1:
    a:
      peer: agg-01
      home_port: ethernet-1/1
      old: {port: ethernet-1/1,  vlan: 101, ip: 172.20.1.1/31}
      new: {port: ethernet-1/11, vlan: 111, ip: 172.20.21.1/31}
    b:
      peer: agg-02
      home_port: ethernet-1/1
      old: {port: ethernet-1/1,  vlan: 102, ip: 172.20.2.1/31}
      new: {port: ethernet-1/11, vlan: 112, ip: 172.20.22.1/31}
