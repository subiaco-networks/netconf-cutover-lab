# The MTSO side of every site's even VLAN (telco mux on ethernet-1/1).
uplinks:
  csr1:
    b:
      peer: csr1
      home_port: ethernet-1/1
      old: {port: ethernet-1/1, vlan: 102, ip: 172.20.2.0/31}
      new: {port: ethernet-1/1, vlan: 112, ip: 172.20.22.0/31}
  csr2:
    b:
      peer: csr2
      home_port: ethernet-1/1
      old: {port: ethernet-1/1, vlan: 202, ip: 172.20.32.0/31}
      new: {port: ethernet-1/1, vlan: 212, ip: 172.20.42.0/31}
