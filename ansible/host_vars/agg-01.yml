# The MTSO side of every site's odd VLAN. The telco muxes all sites onto ethernet-1/1, so old and new circuits
# are both subinterfaces of that one port: on this end only the VLAN/IP changes, never the port.
uplinks:
  csr1:
    a:
      peer: csr1
      home_port: ethernet-1/1
      old: {port: ethernet-1/1, vlan: 101, ip: 172.20.1.0/31}
      new: {port: ethernet-1/1, vlan: 111, ip: 172.20.21.0/31}
  csr2:
    a:
      peer: csr2
      home_port: ethernet-1/1
      old: {port: ethernet-1/1, vlan: 201, ip: 172.20.31.0/31}
      new: {port: ethernet-1/1, vlan: 211, ip: 172.20.41.0/31}
