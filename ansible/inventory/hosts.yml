all:
  children:
    srl:
      hosts:
        csr1:   {ansible_host: 172.30.40.11}
        csr2:   {ansible_host: 172.30.40.12}
        agg-01: {ansible_host: 172.30.40.21}
        agg-02: {ansible_host: 172.30.40.22}
    # one group per site fiber = every node that terminates one of its VLANs; the playbook targets
    #   site_<csr>        both VLANs (turnup, swing, decom, baseline)
    #   site_<csr>_<a|b>  one VLAN: a = odd (agg-01), b = even (agg-02)  (rehome-*)
    site_csr1:   {hosts: {csr1: , agg-01: , agg-02: }}
    site_csr1_a: {hosts: {csr1: , agg-01: }}
    site_csr1_b: {hosts: {csr1: , agg-02: }}
    site_csr2:   {hosts: {csr2: , agg-01: , agg-02: }}
    site_csr2_a: {hosts: {csr2: , agg-01: }}
    site_csr2_b: {hosts: {csr2: , agg-02: }}
